
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тооны машин</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="calculator">
        <input type="text" class="display" id="display" value="0" readonly>

        <div class="buttons">
            <button class="function buttonbig" onclick="clearDisplay()">C</button>
            <button class="function" onclick="changeSign()">+/-</button>
            <button class="operator" onclick="appendValue('/')">/</button>

            <button class="function" onclick="appendValue('7')">7</button>
            <button class="function" onclick="appendValue('8')">8</button>
            <button class="function" onclick="appendValue('9')">9</button>
            <button class="operator" onclick="appendValue('*')">*</button>

            <button class="function" onclick="appendValue('4')">4</button>
            <button class="function" onclick="appendValue('5')">5</button>
            <button class="function" onclick="appendValue('6')">6</button>
            <button class="operator" onclick="appendValue('-')">-</button>

            <button class="function" onclick="appendValue('1')">1</button>
            <button class="function" onclick="appendValue('2')">2</button>
            <button class="function" onclick="appendValue('3')">3</button>
            <button class="operator" onclick="appendValue('+')">+</button>

            <button class="function" onclick="appendValue('0')">0</button>
            <button class="function" onclick="appendValue('.')">.</button>
            <button class="operator buttonbig" onclick="calculate()" >=</button>
        </div>
    </div>

    <script src="main.js"></script>
</body>
</html>
